<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trojan Connect</title>
    <!-- Tailwind CSS CDN for a clean modern design -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col">

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-96 border border-slate-700">
            <h2 class="text-2xl font-bold mb-4 text-center text-blue-400">Trojan Connect</h2>
            <p class="text-sm text-slate-400 mb-6 text-center">Enter your username to join the chat and voice channels.</p>
            <input type="text" id="usernameInput" placeholder="Your username..." class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl mb-4 focus:outline-none focus:border-blue-500 text-slate-100" />
            <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-3 rounded-xl transition duration-200">Start Chatting</button>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="flex-1 flex flex-col max-w-4xl mx-auto w-full p-4 h-full">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center py-3 border-b border-slate-800 mb-4">
            <div class="flex items-center space-x-3">
                <h1 class="text-xl font-bold text-blue-400">Trojan Connect</h1>
                <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-medium">● Live</span>
            </div>
            <div class="flex items-center space-x-3">
                <button id="voiceBtn" onclick="toggleVoiceChannel()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition duration-200 flex items-center space-x-2">
                    <span>🎙️</span>
                    <span id="voiceBtnText">Join Voice</span>
                </button>
                <span id="currentUserDisplay" class="text-sm text-slate-400 font-medium"></span>
            </div>
        </header>

        <!-- CHAT MESSAGES FEED -->
        <div id="chatMessages" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 scrollbar-thin">
            <!-- Messages will load dynamically here -->
        </div>

        <!-- HIDDEN FILE INPUT FOR IMAGES -->
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="uploadImage(this)" />

        <!-- INPUT FORM BAR -->
        <form id="chatForm" onsubmit="sendMessage(event)" class="flex items-center space-x-3 bg-slate-800 p-2 rounded-2xl border border-slate-700">
            <!-- Image Upload Trigger Button -->
            <button type="button" onclick="document.getElementById('imageInput').click()" class="p-3 bg-slate-700 hover:bg-slate-600 rounded-xl transition duration-200 text-lg" title="Send Picture">
                
            </button>
            <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" class="flex-1 bg-transparent px-2 py-2 focus:outline-none text-slate-100 placeholder-slate-500" />
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-xl font-semibold transition duration-200">
                Send
            </button>
        </form>
    </div>

    <!-- AUDIO CONTAINER FOR VOICE CHANNELS -->
    <div id="audio-container" class="hidden"></div>

    <!-- SOCKET.IO CLIENT SCRIPT -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUsername = '';

        // Check persistent login on load
        window.addEventListener('load', () => {
            const savedUser = localStorage.getItem('trojan_username');
            if (savedUser) {
                currentUsername = savedUser;
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('currentUserDisplay').innerText = `👤 ${currentUsername}`;
            }
        });

        function handleLogin() {
            const input = document.getElementById('usernameInput').value.trim();
            if (!input) return alert('Please enter a valid username');
            currentUsername = input;
            localStorage.setItem('trojan_username', currentUsername);
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('currentUserDisplay').innerText = `👤 ${currentUsername}`;
        }

        // Load chat history
        socket.on('load-history', (messages) => {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            messages.forEach(msg => appendMessage(msg));
        });

        // Listen for incoming messages
        socket.on('chat-message', (data) => {
            appendMessage(data);
        });

        // Send text message
        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            socket.emit('chat-message', {
                username: currentUsername,
                message: message,
                imageUrl: null
            });
            input.value = '';
        }

        // Upload picture (Auto-deletes after 2 hours on server)
        async function uploadImage(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.url) {
                    socket.emit('chat-message', {
                        username: currentUsername,
                        message: '',
                        imageUrl: data.url
                    });
                }
            } catch (err) {
                console.error('Image upload failed:', err);
                alert('Failed to upload image.');
            }
            inputElement.value = ''; // Reset input
        }

        // Append message to chat view
        function appendMessage(data) {
            const container = document.getElementById('chatMessages');
            const isMe = data.username === currentUsername;
            
            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-1`;

            let imageHtml = data.imageUrl ? `<img src="${data.imageUrl}" class="max-w-xs rounded-xl mt-2 border border-slate-700 shadow-md" />` : '';
            let textHtml = data.message ? `<p class="bg-${isMe ? 'blue-600' : 'slate-800'} px-4 py-2.5 rounded-2xl max-w-md break-words text-slate-100">${escapeHtml(data.message)}</p>` : '';

            div.innerHTML = `
                <span class="text-xs text-slate-400 px-1 font-medium">${escapeHtml(data.username)}</span>
                ${textHtml}
                ${imageHtml}
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // WebRTC Voice Channels Hook
        let inVoice = false;
        async function toggleVoiceChannel() {
            const btnText = document.getElementById('voiceBtnText');
            if (!inVoice) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    socket.emit('join-voice-channel', 'global-voice-room');
                    inVoice = true;
                    btnText.innerText = "Leave Voice";
                    document.getElementById('voiceBtn').classList.add('bg-emerald-600', 'border-emerald-500');
                    
                    // Attach local audio stream preview if needed
                    const audioEl = document.createElement('audio');
                    audioEl.srcObject = stream;
                    audioEl.muted = true; // Mute self to avoid echo
                    audioEl.autoplay = true;
                    document.getElementById('audio-container').appendChild(audioEl);
                } catch (err) {
                    alert('Microphone access denied or unavailable.');
                }
            } else {
                location.reload(); // Simple refresh to disconnect voice streams
            }
        }
    </script>
</body>
</html>
