<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trojan Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #eab308; }
    </style>
</head>
<body class="bg-zinc-950 text-yellow-400 h-screen flex overflow-hidden font-sans">

    <!-- LOGIN / REGISTER MODAL -->
    <div id="authModal" class="fixed inset-0 bg-black/95 flex items-center justify-center z-50">
        <div class="bg-zinc-900 border border-yellow-500/40 p-8 rounded-2xl shadow-2xl w-96">
            <h2 class="text-3xl font-black mb-1 text-center text-yellow-400 tracking-wider">TROJAN CONNECT</h2>
            <p class="text-xs text-zinc-400 mb-6 text-center">Discord-Style Secure Gateway</p>
            
            <input type="text" id="authUsername" placeholder="Username" class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl mb-3 focus:outline-none focus:border-yellow-400 text-yellow-300 placeholder-zinc-600 text-sm" />
            <input type="password" id="authPassword" placeholder="Password" class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl mb-6 focus:outline-none focus:border-yellow-400 text-yellow-300 placeholder-zinc-600 text-sm" />
            
            <div class="flex space-x-3">
                <button onclick="handleAuth('login')" class="flex-1 bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3 rounded-xl transition text-sm">Log In</button>
                <button onclick="handleAuth('register')" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-yellow-400 border border-yellow-500/30 font-bold py-3 rounded-xl transition text-sm">Sign Up</button>
            </div>
            <p id="authError" class="text-red-500 text-xs text-center mt-4 font-semibold"></p>
        </div>
    </div>

    <!-- DISCORD COLUMN 1: SERVER / NAVIGATION SIDEBAR -->
    <div class="w-18 bg-black border-r border-zinc-900 flex flex-col items-center py-4 space-y-4 shrink-0">
        <!-- Home / DMs Button -->
        <button onclick="switchTab('friends')" id="nav-friends" class="w-12 h-12 rounded-2xl bg-zinc-900 hover:bg-yellow-500 hover:text-black flex items-center justify-center text-xl transition shadow-lg group relative" title="Direct Messages & Friends">
            💬
        </button>
        <div class="w-8 h-[2px] bg-zinc-800 rounded"></div>
        <!-- Global Server Icon -->
        <button onclick="switchChat('global')" id="nav-global" class="w-12 h-12 rounded-2xl bg-yellow-500 text-black font-black flex items-center justify-center text-lg transition shadow-lg" title="Global Lobby">
            TC
        </button>
    </div>

    <!-- DISCORD COLUMN 2: CHANNELS / DIRECT MESSAGES SIDEBAR -->
    <div class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col shrink-0">
        <div class="h-14 border-b border-zinc-800 flex items-center px-4 font-black tracking-wide text-yellow-400 shadow-sm">
            Trojan Connect
        </div>
        
        <div class="flex-1 overflow-y-auto p-3 space-y-6">
            <!-- Channels section -->
            <div>
                <div class="text-[11px] font-bold text-zinc-500 uppercase tracking-wider mb-2 px-2">Text Channels</div>
                <button onclick="switchChat('global')" id="sidebar-global" class="w-full text-left px-3 py-2 rounded-xl text-sm font-bold bg-yellow-500/20 text-yellow-300 border border-yellow-500/30 flex items-center space-x-2">
                    <span>#</span><span>global-lobby</span>
                </button>
            </div>

            <!-- Direct Messages section -->
            <div>
                <div class="text-[11px] font-bold text-zinc-500 uppercase tracking-wider mb-2 px-2 flex justify-between items-center">
                    <span>Direct Messages</span>
                    <button onclick="switchTab('friends')" class="text-yellow-400 hover:text-white font-bold">+</button>
                </div>
                <div id="directMessagesList" class="space-y-1">
                    <!-- Loaded DMs go here -->
                </div>
            </div>
        </div>

        <!-- User Footer Profile -->
        <div class="h-16 bg-zinc-950 border-t border-zinc-800 px-3 flex items-center justify-between">
            <div class="flex items-center space-x-2 truncate">
                <div class="w-8 h-8 rounded-full bg-yellow-500 text-black font-black flex items-center justify-center text-xs" id="userAvatar">U</div>
                <span id="currentDisplayUser" class="text-xs font-bold text-yellow-300 truncate"></span>
            </div>
            <button onclick="logout()" class="text-xs text-zinc-500 hover:text-red-400 font-bold px-2 py-1">🚪</button>
        </div>
    </div>

    <!-- DISCORD COLUMN 3: MAIN CHAT OR FRIENDS PANEL -->
    <div class="flex-1 flex flex-col bg-zinc-950">
        
        <!-- CHAT HEADER -->
        <div class="h-14 border-b border-zinc-800 px-6 flex justify-between items-center bg-zinc-900/50">
            <h2 id="activeChatTitle" class="font-bold text-base text-yellow-400 flex items-center space-x-2">
                <span>#</span><span>global-lobby</span>
            </h2>
            <div class="flex items-center space-x-3">
                <button id="voiceBtn" onclick="toggleVoice()" class="bg-black border border-yellow-500/40 hover:bg-yellow-500 hover:text-black px-4 py-1.5 rounded-xl text-xs font-bold text-yellow-400 transition">
                    🎙️ Voice Channel
                </button>
            </div>
        </div>

        <!-- VIEW 1: CHAT FEED -->
        <div id="chatView" class="flex-1 flex flex-col h-full overflow-hidden">
            <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Messages load here -->
            </div>

            <!-- Hidden File Input -->
            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="uploadImage(this)" />

            <!-- Chat Input Bar -->
            <div class="p-4 bg-zinc-900/40">
                <form id="chatForm" onsubmit="sendMessage(event)" class="flex items-center space-x-3 bg-zinc-900 border border-zinc-800 p-2 rounded-2xl">
                    <button type="button" onclick="document.getElementById('imageInput').click()" class="p-2.5 bg-zinc-800 hover:bg-zinc-700 rounded-xl transition text-yellow-400" title="Upload Image">
                        📷
                    </button>
                    <input type="text" id="messageInput" placeholder="Message #global-lobby..." autocomplete="off" class="flex-1 bg-transparent px-2 py-1.5 focus:outline-none text-yellow-300 placeholder-zinc-600 text-sm" />
                    <button type="submit" class="bg-yellow-500 hover:bg-yellow-400 text-black font-bold px-5 py-2.5 rounded-xl text-sm transition">
                        Send
                    </button>
                </form>
            </div>
        </div>

        <!-- VIEW 2: FRIENDS & DISCOVERY PANEL -->
        <div id="friendsView" class="flex-1 p-6 overflow-y-auto hidden">
            <h3 class="text-xl font-black text-yellow-400 mb-6">👥 Friends & User Discovery</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Add Friend / User List -->
                <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
                    <h4 class="font-bold text-sm text-yellow-400 mb-4 uppercase tracking-wider">All Users</h4>
                    <div id="discoveryList" class="space-y-2">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- Pending & Current Friends -->
                <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
                    <h4 class="font-bold text-sm text-yellow-400 mb-4 uppercase tracking-wider">Your Friends & Requests</h4>
                    <div id="friendRequestsList" class="space-y-3">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- SOCKET.IO CLIENT -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = localStorage.getItem('trojan_username') || '';
        let currentRecipient = 'global';
        let allAppData = { users: [], friendships: [] };

        window.addEventListener('load', () => {
            if (currentUser) {
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('currentDisplayUser').innerText = currentUser;
                document.getElementById('userAvatar').innerText = currentUser.charAt(0).toUpperCase();
                initApp();
            }
        });

        function handleAuth(type) {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if (!username || !password) {
                document.getElementById('authError').innerText = 'Please enter username and password.';
                return;
            }
            socket.emit(type, { username, password });
        }

        socket.on('auth-success', (data) => {
            currentUser = data.username;
            localStorage.setItem('trojan_username', currentUser);
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('currentDisplayUser').innerText = currentUser;
            document.getElementById('userAvatar').innerText = currentUser.charAt(0).toUpperCase();
            initApp();
        });

        socket.on('auth-error', (msg) => {
            document.getElementById('authError').innerText = msg;
        });

        function logout() {
            localStorage.removeItem('trojan_username');
            location.reload();
        }

        function initApp() {
            socket.emit('get-friends-data', { username: currentUser });
            socket.emit('load-history', { recipient: currentRecipient, currentUser });
            setInterval(() => socket.emit('get-friends-data', { username: currentUser }), 4000);
        }

        // Tab Switching (Chat vs Friends panel)
        function switchTab(tab) {
            if (tab === 'friends') {
                document.getElementById('chatView').classList.add('hidden');
                document.getElementById('friendsView').classList.remove('hidden');
                document.getElementById('activeChatTitle').innerText = "👥 Friends & Users";
            }
        }

        function switchChat(recipient) {
            currentRecipient = recipient;
            document.getElementById('chatView').classList.remove('hidden');
            document.getElementById('friendsView').classList.add('hidden');

            if (recipient === 'global') {
                document.getElementById('activeChatTitle').innerHTML = '<span>#</span><span>global-lobby</span>';
                document.getElementById('messageInput').placeholder = 'Message #global-lobby...';
            } else {
                document.getElementById('activeChatTitle').innerHTML = `<span>@</span><span>${recipient}</span>`;
                document.getElementById('messageInput').placeholder = `Message @${recipient}...`;
            }

            socket.emit('load-history', { recipient: currentRecipient, currentUser });
        }

        // Friends Data Synchronization
        socket.on('friends-data', (data) => {
            allAppData = data;
            renderFriendsUI();
        });

        socket.on('friend-update', () => {
            socket.emit('get-friends-data', { username: currentUser });
        });

        function renderFriendsUI() {
            const discoveryList = document.getElementById('discoveryList');
            const reqList = document.getElementById('friendRequestsList');
            const dmList = document.getElementById('directMessagesList');
            
            discoveryList.innerHTML = '';
            reqList.innerHTML = '';
            dmList.innerHTML = '';

            const myFriendships = allAppData.friendships.filter(f => f.sender === currentUser || f.receiver === currentUser);
            const acceptedFriends = myFriendships.filter(f => f.status === 'accepted').map(f => f.sender === currentUser ? f.receiver : f.sender);

            // Render DMs Sidebar
            acceptedFriends.forEach(friend => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2 rounded-xl text-sm font-bold flex items-center space-x-2 transition ${currentRecipient === friend ? 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30' : 'text-zinc-400 hover:bg-zinc-800 hover:text-yellow-300'}`;
                btn.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>${friend}</span>`;
                btn.onclick = () => switchChat(friend);
                dmList.appendChild(btn);
            });

            // Render Discovery / Add Friend
            allAppData.users.forEach(u => {
                if (u === currentUser) return;
                const friendship = myFriendships.find(f => f.sender === u || f.receiver === u);
                
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-zinc-950 p-3 rounded-xl border border-zinc-800";
                
                let actionBtn = '';
                if (!friendship) {
                    actionBtn = `<button onclick="sendFriendRequest('${u}')" class="bg-yellow-500 hover:bg-yellow-400 text-black px-3 py-1.5 rounded-lg text-xs font-bold transition">Add Friend</button>`;
                } else if (friendship.status === 'pending') {
                    if (friendship.receiver === currentUser) {
                        actionBtn = `<button onclick="acceptFriend('${friendship.sender}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">Accept</button>`;
                    } else {
                        actionBtn = `<span class="text-xs text-zinc-500 font-bold">Requested</span>`;
                    }
                } else {
                    actionBtn = `<span class="text-xs text-emerald-400 font-bold">Friends</span>`;
                }

                div.innerHTML = `<span class="text-sm font-bold text-yellow-300">@${u}</span>${actionBtn}`;
                discoveryList.appendChild(div);
            });
        }

        function sendFriendRequest(recipient) {
            socket.emit('send-friend-request', { sender: currentUser, recipient });
        }

        function acceptFriend(friend) {
            socket.emit('accept-friend-request', { user: currentUser, friend });
        }

        // Messages Handling
        socket.on('history-loaded', (data) => {
            const messages = Array.isArray(data) ? data : data.messages;
            const recipient = Array.isArray(data) ? currentRecipient : data.recipient;
            if (recipient !== currentRecipient || !Array.isArray(messages)) return;
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            messages.forEach(msg => appendMessage(msg));
        });

        socket.on('chat-message', (data) => {
            if (isCurrentConversation(data)) {
                appendMessage(data);
            }
        });

        function isCurrentConversation(data) {
            if (currentRecipient === 'global') return data.recipient === 'global';
            return (data.sender === currentUser && data.recipient === currentRecipient) ||
                (data.sender === currentRecipient && data.recipient === currentUser);
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            socket.emit('chat-message', {
                sender: currentUser,
                recipient: currentRecipient,
                message: message,
                imageUrl: null
            });
            input.value = '';
        }

        async function uploadImage(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('image', file);

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.url) {
                    socket.emit('chat-message', {
                        sender: currentUser,
                        recipient: currentRecipient,
                        message: '',
                        imageUrl: data.url
                    });
                }
            } catch (e) {
                alert('Image upload failed.');
            }
            inputElement.value = '';
        }

        function appendMessage(data) {
            const container = document.getElementById('chatMessages');
            const isMe = data.sender === currentUser;

            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-1`;

            const timestamp = data.createdAt || data.created_at;
            const formattedTime = timestamp ? new Date(timestamp).toLocaleString([], {
                dateStyle: 'medium',
                timeStyle: 'short'
            }) : '';
            const imageUrl = data.imageUrl || data.image_url;
            let imgHtml = imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="Shared image" class="max-w-xs rounded-xl mt-2 border border-yellow-500/30 shadow-md" />` : '';
            let textHtml = data.message ? `<p class="px-4 py-2.5 rounded-2xl max-w-md break-words text-sm ${isMe ? 'bg-yellow-500 text-black font-semibold' : 'bg-zinc-900 text-yellow-300 border border-zinc-800'}">${escapeHtml(data.message)}</p>` : '';

            div.innerHTML = `
                <span class="text-[10px] text-zinc-500 px-1 font-mono font-bold">${escapeHtml(data.sender)}${formattedTime ? ` <time datetime="${escapeHtml(timestamp)}">${escapeHtml(formattedTime)}</time>` : ''}</span>
                ${textHtml}
                ${imgHtml}
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        let inVoice = false;
        async function toggleVoice() {
            try {
                if (!inVoice) {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    inVoice = true;
                    document.getElementById('voiceBtn').innerText = "🔴 Leave Voice";
                    document.getElementById('voiceBtn').className = "bg-red-600 text-white font-bold px-4 py-1.5 rounded-xl text-xs transition";
                } else {
                    location.reload();
                }
            } catch (e) {
                alert('Microphone access denied.');
            }
        }
    </script>
</body>
</html>
